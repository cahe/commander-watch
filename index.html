<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commander Watch</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f5f8b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body { margin: 0; }
/* Layout: one reading column — status strip, "new" shelf, then a filterable catalog list. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --fg: #16202b;
  --muted: #5b6878;
  --line: #d5dce4;
  --accent: #1f5f8b;
  --accent-soft: #dcebf6;
  --new: #b4531a;
  --dot: #d93025;
  --new-soft: #fbe9dc;
  --ok: #2f7a4b;
  --ok-soft: #dff1e5;
  --warn: #8a6a12;
  --warn-soft: #f6eecf;
  --off: #7a8491;
  --off-soft: #e9ecf0;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #17202a; --fg: #e5ebf1; --muted: #93a1b1; --line: #2a3643;
    --accent: #7fb8e0; --accent-soft: #1b3346; --new: #f0a06a; --new-soft: #3a2517;
    --ok: #7fd09c; --ok-soft: #173424; --warn: #e4c66a; --warn-soft: #362d12; --off: #8e99a6; --off-soft: #222c37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #17202a; --fg: #e5ebf1; --muted: #93a1b1; --line: #2a3643;
  --accent: #7fb8e0; --accent-soft: #1b3346; --new: #f0a06a; --new-soft: #3a2517;
  --ok: #7fd09c; --ok-soft: #173424; --warn: #e4c66a; --warn-soft: #362d12; --off: #8e99a6; --off-soft: #222c37;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 28px; }
header { display: grid; gap: 6px; }
h1 { font: 800 clamp(28px, 5vw, 40px)/1.05 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font: 600 20px/1.2 var(--font-display); margin: 0; }
.label { font: 500 11px/1 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

.shops { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.shop { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.shop-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.shop-name { font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
.dot.ok { background: var(--ok); } .dot.err { background: var(--new); }
.shop-meta { font: 12px/1.4 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.lastcheck { font: 13px/1.4 var(--font-mono); color: var(--muted); }

section { display: grid; gap: 12px; }
.sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
#st-h + .lastcheck { margin-left: auto; }

/* Panels: each can be folded to its title line and moved; the layout is remembered per browser. */
.panels { display: grid; gap: 28px; }
.ptoggle { display: inline; padding: 0; border: 0; border-radius: 4px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.ptoggle .chev { width: 14px; height: 14px; margin: 0 6px 0 -2px; vertical-align: 1px; color: var(--muted); transition: transform .2s; }
.ptoggle:hover .chev { color: var(--fg); }
.ptoggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.panel.closed .chev { transform: rotate(-90deg); }
.panel.closed > :not(.phead) { display: none; }
section.changes.closed .changes-head { padding-bottom: 12px; }
.pctl { margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: 2px; position: relative; }
.soundbtn + .pctl { margin-left: 0; }
.iconbtn { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
.iconbtn svg { width: 16px; height: 16px; }
.iconbtn:hover:not(:disabled), .iconbtn[aria-expanded="true"] { color: var(--fg); background: var(--off-soft); }
.iconbtn:disabled { opacity: .3; cursor: default; }
.iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pmenu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 20; min-width: 170px; padding: 4px; display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.pmenu[hidden] { display: none; }
.pmenu button { padding: 7px 10px; border: 0; border-radius: 5px; background: none; color: var(--fg); font: 14px var(--font-body); text-align: left; cursor: pointer; }
.pmenu button:hover:not(:disabled), .pmenu button:focus-visible { background: var(--accent-soft); outline: none; }
.pmenu button:disabled { color: var(--muted); opacity: .6; cursor: default; }
/* Phones: title and controls on the first line, the count under them. */
@media (max-width: 640px) { .phead .count, .phead .sum { order: 5; flex-basis: 100%; margin-top: -6px; } }
.panel.dragging .phead { border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.2); cursor: grabbing; position: relative; z-index: 2; }

.newshelf { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--new); border-radius: 8px; overflow: hidden; }
.newgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 1px; background: var(--line); }
.newrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; align-content: start; padding: 9px 14px; background: var(--surface); }
.newrow strong { font-weight: 600; overflow-wrap: anywhere; }
.newrow .offers { grid-column: 1 / -1; margin-top: 0; }
.newmore { display: block; width: 100%; padding: 9px 14px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font: 500 13px var(--font-body); text-align: left; cursor: pointer; }
.newmore:hover { text-decoration: underline; }
.newmore:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted); }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: 500 13px/1 var(--font-body); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.chip:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="search"], select { font: 14px var(--font-body); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
input[type="search"] { flex: 1 1 200px; min-width: 0; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) 110px 96px 150px; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item.head { font: 500 11px/1 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-block: 10px; }
.deck { min-width: 0; display: grid; gap: 2px; }
.deck a { color: var(--fg); text-decoration: none; overflow-wrap: anywhere; }
.deck a:hover { color: var(--accent); text-decoration: underline; }
.deck .shoptag { font-size: 12px; color: var(--muted); }
.price { font: 500 14px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; display: grid; justify-items: end; gap: 3px; }
.spark { display: block; color: var(--accent); overflow: visible; }
.spark .spark-low, .hchart .dot-low { fill: var(--ok); }
.alertbell { display: inline-flex; vertical-align: -3px; margin-left: 6px; padding: 3px; border-radius: 50%; color: var(--accent); }
.alertbell svg { width: 17px; height: 17px; stroke-width: 1.7; }
.alertbell:hover { background: var(--accent-soft); }
.pinbtn { display: inline-flex; vertical-align: -3px; margin-left: 2px; padding: 3px; border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; }
.pinbtn svg { width: 16px; height: 16px; }
.pinbtn:hover { color: var(--accent); background: var(--accent-soft); }
.pinbtn[aria-pressed="true"] { color: var(--accent); }
.pinbtn[aria-pressed="true"] svg { fill: currentColor; }
.pinbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pinned { display: grid; gap: 10px; }
.pinned[hidden] { display: none; }
.pincard { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px 14px; }
.pincard .offers { margin-top: 0; }
.offer.more { border: 1px dashed var(--off); background: none; color: var(--muted); font: 500 12px/1 var(--font-body); cursor: pointer; }
.offer.more:hover { color: var(--fg); border-color: var(--muted); }
.offer.more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pin-slim { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; }
.pin-title { display: flex; align-items: center; gap: 4px 8px; }
.pin-title h2 { font-size: 18px; }
.pin-title .alertbell { margin-left: 0; }
.pin-price { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.pin-price b { font: 500 16px var(--font-mono); font-variant-numeric: tabular-nums; }
.pin-slim .hbtn { margin-left: auto; }
@media (min-width: 641px) { .pin-slim { flex-wrap: nowrap; } .pin-price { flex-wrap: nowrap; white-space: nowrap; } }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); max-width: min(520px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 8px; background: var(--fg); color: var(--bg); font: 14px/1.4 var(--font-body); box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.alertbtn { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--accent); font: 500 12px var(--font-body); text-decoration: none; }
.alertbtn:hover { border-color: var(--accent); background: var(--accent-soft); }
.alertbell:focus-visible, .alertbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hbtn { padding: 2px 0; border: 0; background: none; color: var(--accent); font: 500 12px var(--font-body); cursor: pointer; }
.hbtn:hover .spark { color: var(--fg); }
.hbtn[aria-expanded="true"] .spark { color: var(--fg); }
.hbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.item.hrow { display: block; border-top: 0; padding-top: 0; }
.hpanel { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 6px; }
.hlegend { display: flex; flex-wrap: wrap; gap: 14px; font: 12px var(--font-body); color: var(--muted); }
.hlegend .k { display: inline-flex; align-items: center; white-space: nowrap; }
.hlegend .k::before { content: ""; display: inline-block; flex: none; width: 14px; height: 0; margin-right: 6px; vertical-align: middle; border-top: 2px solid var(--accent); }
.hlegend .k.ct::before { border-top: 2px dashed var(--muted); }
.hlegend .k.low::before { width: 7px; height: 7px; border: 0; border-radius: 50%; background: var(--ok); }
.hwrap { position: relative; }
.hchart { display: block; width: 100%; height: auto; margin-top: 4px; }
.hchart .grid { stroke: var(--line); }
.hchart .axis { font: 11px var(--font-mono); fill: var(--muted); }
.hchart .line-shops { fill: none; stroke: var(--accent); stroke-width: 2; }
.hchart .line-ct { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.hchart .guide { stroke: var(--muted); stroke-width: 1; }
.htip { position: absolute; top: 4px; padding: 4px 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); font: 12px var(--font-mono); white-space: nowrap; pointer-events: none; }
.seen { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font: 500 12px/1 var(--font-body); padding: 5px 8px; border-radius: 4px; white-space: nowrap; }
.pill.in_stock { background: var(--ok-soft); color: var(--ok); }
.pill.preorder { background: var(--warn-soft); color: var(--warn); }
.pill.out_of_stock { background: var(--off-soft); color: var(--off); }
.pill.new { background: var(--new-soft); color: var(--new); }
.count { font: 13px var(--font-mono); color: var(--muted); }
.kind { font: 500 11px/1 var(--font-body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-left: 6px; white-space: nowrap; }
.offers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.offer { display: inline-flex; gap: 6px; align-items: baseline; font: 12px/1 var(--font-body); padding: 5px 8px; border-radius: 4px; text-decoration: none; border: 1px solid transparent; }
.offer b { font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.offer.in_stock { background: var(--ok-soft); color: var(--ok); }
.offer.out_of_stock { background: var(--off-soft); color: var(--off); }
.offer i { font: 500 11px/1 var(--font-body); font-style: normal; text-transform: lowercase; opacity: .85; }
.offer.out_of_stock b { text-decoration: line-through; text-decoration-thickness: 1px; }
.offer.best { border-color: currentColor; }
.offer:hover { text-decoration: underline; }
.avail { font-size: 13px; color: var(--muted); }
section.changes { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.changes-head { padding: 12px 14px 0; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.changes-head .sum { font-size: 13px; color: var(--muted); min-width: 0; }
.changes-head .sum b { color: var(--fg); font-weight: 600; }
.soundbtn { margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--muted); font: 500 12px var(--font-body); cursor: pointer; white-space: nowrap; }
.soundbtn:hover { color: var(--fg); border-color: var(--muted); }
.soundbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.soundbtn .wave { display: none; } .soundbtn[aria-pressed="true"] .wave { display: inline; } .soundbtn[aria-pressed="true"] .mute { display: none; }
.soundbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.changes-body { padding: 0 14px 10px; display: grid; gap: 4px; }
.changes-body > .day:first-child { margin-top: 10px; }
#changes-filters { padding: 12px 14px 0; gap: 6px; }
#changes-filters .chip { font-size: 12px; padding: 6px 10px; }
#changes-filters:not(:empty) + #changes-list > .day:first-child { margin-top: 24px; }
/* Folded: a button on the faded edge where the hidden rows continue. Expanded: a "Show less" bar that sticks
   to the bottom of the screen while the list is in view. */
.changes-edge { position: relative; display: flex; justify-content: center; margin-top: -26px; padding: 0 14px 12px; }
.changes-less { position: sticky; bottom: 0; z-index: 1; display: flex; justify-content: center; padding: 8px 14px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; }
.changes-edge[hidden], .changes-less[hidden] { display: none; }
.pillbtn { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--accent); font: 500 13px var(--font-body); cursor: pointer; }
.pillbtn:hover, #changes-fold:has(.peek:hover) .pillbtn { background: var(--accent-soft); border-color: var(--accent); }
.pillbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#changes-filters:empty { display: none; }
/* Folded, the next earlier change peeks out under the latest ones and fades away; clicking it expands. */
.peek { max-height: 52px; overflow: hidden; cursor: pointer; -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }
.peek > * { pointer-events: none; user-select: none; }
.peek:hover { -webkit-mask-image: linear-gradient(#000 30%, transparent); mask-image: linear-gradient(#000 30%, transparent); }
.change.unseen { position: relative; }
.change.unseen::before { content: ""; position: absolute; left: -9px; top: 15px; width: 6px; height: 6px; border-radius: 50%; background: var(--dot); }
.change.unseen .when { color: var(--fg); font-weight: 600; }
.changes .day { font: 500 11px/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 4px; }
.change { display: grid; grid-template-columns: 44px 150px minmax(0, 1fr); gap: 12px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.change .when { font: 12px/1.6 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.change .what { font-size: 14px; line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }
.change .what a { color: var(--fg); font-weight: 600; text-decoration: none; }
.change .what a:hover { color: var(--accent); text-decoration: underline; }
.change .num { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.change .num.gone { color: var(--muted); text-decoration: line-through; }
.change .num.down { color: var(--ok); } .change .num.upc { color: var(--new); }
.change .ctx { font-size: 13px; color: var(--muted); margin-top: 2px; }
.change .ctx.good { color: var(--ok); }
.tag { display: inline-block; font: 500 12px/1 var(--font-body); padding: 5px 8px; border-radius: 4px; white-space: nowrap; background: var(--off-soft); color: var(--off); }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.new, .tag.up { background: var(--new-soft); color: var(--new); } .tag.accent { background: var(--accent-soft); color: var(--accent); }
@media (max-width: 640px) {
  .change { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "tag when" "what what"; row-gap: 4px; }
  .change > span:nth-child(2) { grid-area: tag; } .change .when { grid-area: when; text-align: right; } .change .what { grid-area: what; }
}

@media (max-width: 640px) {
  .item { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "deck deck" "status price" "seen seen"; row-gap: 6px; }
  .item.head { display: none; }
  .deck { grid-area: deck; } .price { grid-area: price; } .st { grid-area: status; } .seen { grid-area: seen; text-align: right; }
}
@media (prefers-reduced-motion: no-preference) { .chip { transition: background .15s, color .15s; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <span class="label">Magic: The Gathering · Polish shops</span>
    <h1>Commander Watch</h1>
  </header>

  <section class="pinned" id="pinned" aria-label="Pinned deck" hidden></section>

  <div class="panels" id="panels">
  <section class="changes panel" data-panel="changes" aria-labelledby="changes-h">
    <div class="changes-head phead"><h2 id="changes-h">Changes</h2><span class="sum" id="changes-sum">Loading…</span>
      <button class="soundbtn" id="sound" type="button" aria-pressed="false" title="Play a sound when a deck is back in stock, new, or the new cheapest option">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h2.5L9 3v10L5.5 10H3z"/><path class="wave" d="M11.5 5.5a3.5 3.5 0 0 1 0 5M13.5 3.5a6.5 6.5 0 0 1 0 9"/><path class="mute" d="M11.5 6l4 4M15.5 6l-4 4"/>
        </svg><span>Sound off</span></button></div>
    <div id="changes-fold">
      <div class="controls" id="changes-filters" role="group" aria-label="Filter changes"></div>
      <div class="changes-body" id="changes-list"></div>
      <div class="changes-edge" id="changes-edge" hidden><button class="pillbtn" id="changes-more" type="button" aria-controls="changes-list" aria-expanded="false"></button></div>
      <div class="changes-less" id="changes-less" hidden><button class="pillbtn" id="changes-fewer" type="button" aria-controls="changes-list" aria-expanded="true">Show less ▴</button></div>
    </div>
  </section>

  <section class="panel" data-panel="new" aria-labelledby="new-h">
    <div class="sec-head phead"><h2 id="new-h">New listings</h2><span class="count" id="newcount"></span></div>
    <div id="newshelf" class="newshelf"></div>
  </section>

  <section class="panel" data-panel="decks" aria-labelledby="cat-h">
    <div class="sec-head phead"><h2 id="cat-h">All tracked decks</h2><span class="count" id="catcount"></span></div>

</div>

<script>
const SHOPS = {
  time4magic: { name: "Time4Magic", home: "https://time4magic.pl/commander-decki-magic-the-gathering" },
  cardstore: { name: "Cardstore", home: "https://cardstore.pl/157-commander" },
  mrpuggy: { name: "Mr. Puggy", home: "https://mrpuggy.pl/pl/c/Magic-The-Gathering/23" },
  wargamer: { name: "Wargamer", home: "https://sklep.wargamer.pl/pl/43-magic-the-gathering" },
  xjoy: { name: "XJoy", home: "https://www.xjoy.pl/371-mtg-commander" },
  dragoneye: { name: "Dragoneye", home: "https://dragoneye.pl/magic-the-gathering-c-16_211.html" },
  panmysza: { name: "Pan Mysza", home: "https://panmysza.pl/pl/c/Magic-The-Gathering/53" },

  magiccafe: { name: "Magic Cafe", home: "https://magiccafe.eu/product-category/gry-karciane/magic-the-gathering-pl/mtg-gotowe-talie/" },
  wilczek: { name: "Wilczek", home: "https://wilczek.poznan.pl/product/search?query=commander" },
  // Marketplace: prices only (no pushes), converted to PLN, shown only next to decks a shop sells.
  cardtrader: { name: "CardTrader", home: "https://www.cardtrader.com/en/magic", approx: true, extra: true }
};
// Telegram bot for single-deck alerts (telegram_bot.py); its "start" link carries the deck's permanent key.
const TELEGRAM_BOT = "commanderwatchbot";
const BELL = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.5 1.5h-11z"/><path d="M6.5 14a1.5 1.5 0 0 0 3 0"/></svg>';
function alertLink(g, cls, label) {
  const key = g.offers.find(o => o.deck)?.deck;
  if (!TELEGRAM_BOT || !key) return null;
  const a = el("a", { class: cls, href: `https://t.me/${TELEGRAM_BOT}?start=${encodeURIComponent(key)}`, target: "_blank", rel: "noopener",
    title: `Get a Telegram message when ${g.name} gets cheaper or is back in stock`, "aria-label": `Get alerts for ${g.name} on Telegram` });

  if (label) a.append(el("span", { text: label }));

  return a;
}
let toastTimer = null;
function toast(text) {
  let t = $("toast");
  if (!t) { t = el("div", { id: "toast", class: "toast", role: "status" }); document.body.append(t); }
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 9000);
}
const STATUS_LABEL = { in_stock: "In stock", preorder: "Pre-order", out_of_stock: "Out of stock" };
const OFFER_WORD = { in_stock: "in stock", preorder: "pre-order", out_of_stock: "sold out" };
// A preorder is shown as in stock: shops label the same release differently, and it ships when the others do.
const shownStatus = (s) => (s === "preorder" ? "in_stock" : STATUS_LABEL[s] ? s : "out_of_stock");
const state = { decks: [], meta: null, changes: null, changeFilter: "", shop: "", q: "", status: "in_stock", sort: "seen" };
const $ = (id) => document.getElementById(id);
const pln = new Intl.NumberFormat("pl-PL", { style: "currency", currency: "PLN" });
const dfmt = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });
const tfmt = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k) e.append(k);

}
function safeUrl(u) { try { const x = new URL(u); return x.protocol === "https:" ? x.href : "#"; } catch { return "#"; } }
function pill(s) { return el("span", { class: "pill " + (STATUS_LABEL[s] ? s : "out_of_stock"), text: STATUS_LABEL[s] || "Unknown" }); }
function fmtDate(iso) { const d = new Date(iso); return isNaN(d) ? "—" : dfmt.format(d); }

function renderShops() {
  const box = $("shops"); box.replaceChildren();
  const m = state.meta?.shops || {};
  for (const [key, s] of Object.entries(SHOPS)) {
    const info = m[key] || {};
    const n = state.decks.filter(d => d.shop === key).length;
    const failing = (info.failStreak || 0) > 0;
    const dot = el("span", { class: "dot " + (state.meta ? (failing ? "err" : "ok") : ""), "aria-hidden": "true" });
    const status = !state.meta ? "Not checked yet" : failing ? `Unreachable for the last ${info.failStreak} check${info.failStreak > 1 ? "s" : ""}` : "Reachable";
    box.append(el("div", { class: "shop" },
      el("div", { class: "shop-top" }, el("a", { class: "shop-name", href: s.home, target: "_blank", rel: "noopener", text: s.name, style: "color:inherit" }), dot),
      el("span", { class: "shop-meta", text: n + (n === 1 ? " deck · " : " decks · ") + status })

  }
}

// New listings: one compact row per deck (a deck several shops added counts once), latest first.
const NEW_SHOWN = () => matchMedia("(max-width: 640px)").matches ? 3 : 6;  // one column on phones, two of three on wide screens
function renderNew() {
  const decks = new Map();
  for (const d of state.decks.filter(d => !d.baseline)) {
    const key = d.group || d.id;
    if (!decks.has(key)) decks.set(key, { name: d.groupName || d.name, items: [] });
    decks.get(key).items.push(d);
  }
  const rows = [...decks.values()].map(g => ({ ...g, at: g.items.map(d => String(d.firstSeen)).sort().pop() }))
    .sort((a, b) => b.at.localeCompare(a.at) || a.name.localeCompare(b.name));
  const shelf = $("newshelf"); shelf.replaceChildren();
  $("newcount").textContent = rows.length ? `${rows.length} ${rows.length === 1 ? "deck" : "decks"} since tracking started` : "";
  if (!rows.length) {
    shelf.append(el("div", { class: "newrow" }, el("span", { class: "avail", text: "Nothing new yet. When a shop adds a Commander deck it hasn't listed before, it shows up here within the hour." })));
    return;
  }
  const grid = el("div", { class: "newgrid" });
  shelf.append(grid);
  const limit = NEW_SHOWN();
  for (const g of state.newAll ? rows : rows.slice(0, limit)) {
    const offers = el("div", { class: "offers" });
    for (const o of g.items.sort((a, b) => (a.price ?? 1e9) - (b.price ?? 1e9))) {
      const status = shownStatus(o.status);
      offers.append(el("a", { class: "offer " + status, href: safeUrl(o.url), target: "_blank", rel: "noopener", title: `${o.name} · ${STATUS_LABEL[status]}` },
        el("span", { text: SHOPS[o.shop]?.name || o.shop }), el("b", { text: money(o.shop, o.price) }), el("i", { text: OFFER_WORD[status] })));
    }
    grid.append(el("div", { class: "newrow" }, el("strong", { text: g.name }), el("span", { class: "seen", text: fmtDate(g.at) }), offers));
  }
  if (rows.length > limit) {
    const more = el("button", { class: "newmore", type: "button", "aria-expanded": String(!!state.newAll),
      text: state.newAll ? "Show fewer" : `Show all ${rows.length} decks` });
    more.addEventListener("click", () => { state.newAll = !state.newAll; renderNew(); });
    shelf.append(more);
  }
}

function renderChips() {
  const box = $("shopchips"); box.replaceChildren();
  const opts = [["", "All shops"], ...Object.entries(SHOPS).map(([k, s]) => [k, s.name])];
  for (const [k, label] of opts) {
    const b = el("button", { class: "chip", type: "button", "aria-pressed": String(state.shop === k), text: label });
    b.addEventListener("click", () => { state.shop = k; renderChips(); renderList(); });
    box.append(b);
  }
}

// One row per deck: check.py gives listings of the same deck a shared "group" and "groupName".
function groupDecks() {
  // Shops number products in the order they add them. IDs can't be compared across shops,
  // so each listing gets its rank within its own shop: 1 = that shop's newest listing.
  const rank = new Map(), byShop = new Map();
  for (const d of state.decks) if (typeof d.pid === "number") (byShop.get(d.shop) || byShop.set(d.shop, []).get(d.shop)).push(d);
  for (const list of byShop.values()) {
    list.sort((a, b) => a.pid - b.pid);
    list.forEach((d, i) => rank.set(d, list.length > 1 ? i / (list.length - 1) : 1));
  }
  const groups = new Map();
  for (const d of state.decks) {
    const key = d.group || d.id;
    if (!groups.has(key)) groups.set(key, { name: d.groupName || d.name, offers: [] });
    groups.get(key).offers.push(d);
  }
  for (const g of groups.values()) {
    g.offers.sort((a, b) => (a.price ?? 1e9) - (b.price ?? 1e9));
    // A deck is new only if no shop already had it when tracking (or a shop's tracking) began.
    const known = g.offers.some(o => o.baseline);
    g.firstSeen = known ? null : g.offers.map(o => String(o.firstSeen)).sort()[0];
    g.newest = g.offers.filter(o => !o.baseline).map(o => String(o.firstSeen)).sort().pop() || "";
    // Average over shops: one shop listing an older deck late shouldn't make it look new.
    const ranks = g.offers.map(o => rank.get(o)).filter(r => r !== undefined);
    g.recency = ranks.length ? ranks.reduce((s, r) => s + r, 0) / ranks.length : 0;
    const n = g.offers.map(o => o.name.toLowerCase()).join(" ");
    g.kind = /collector/.test(n) ? (/display|\bset\b|zestaw|\(4|\(5/.test(n) ? "Collector's set" : "Collector's edition")
           : /display|\bset\b|zestaw|\(4|\(5/.test(n) ? "Deck set" : "";
  }
  return [...groups.values()];
}

// A deck's shops, cheapest first. Colour and word both give the shop's stock status; "best" gets an outline.
function offerChips(g, best, bestNote) {
  const offers = el("div", { class: "offers" });
  for (const o of g.offers) {
    const status = shownStatus(o.status);
    offers.append(el("a", { class: "offer " + status + (o === best ? " best" : ""), href: safeUrl(o.url), target: "_blank", rel: "noopener",
        title: `${o.name} · ${STATUS_LABEL[status]}${o === best ? " · " + bestNote : ""}` },
      el("span", { text: SHOPS[o.shop]?.name || o.shop }), el("b", { text: money(o.shop, o.price) }),
      el("i", { text: OFFER_WORD[status] })));
  }
  return offers;
}
const orderable = (o) => o.status === "in_stock" || o.status === "preorder";
function stockText(g) {
  const n = g.offers.filter(orderable).length;
  return n ? `In stock at ${n} of ${g.offers.length}` : `Out of stock (${g.offers.length})`;
}

// Pinned decks: up to 3 decks a visitor keeps at the top of the page, in the order they were pinned; pinning
// a 4th unpins the oldest. Remembered per browser by the decks' permanent keys, so regrouping doesn't lose them.
const PIN_MAX = 3;
const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>';
state.pinned = []; state.pinAll = new Set();
try { state.pinned = (JSON.parse(localStorage.getItem("pinnedDecks") || "[]") || []).filter(k => typeof k === "string").slice(-PIN_MAX); } catch {}
const deckKey = (g) => g.offers.find(o => o.deck)?.deck || "";
function setPinned(keys) {
  state.pinned = keys;
  try { localStorage.setItem("pinnedDecks", JSON.stringify(keys)); } catch {}
  renderPinned(); renderList();
}
function pinButton(g, cls = "pinbtn") {
  const key = deckKey(g);
  if (!key) return null;
  const on = state.pinned.includes(key);
  const b = el("button", { class: cls, type: "button", "aria-pressed": String(on),
    title: on ? "Unpin from the top of the page" : "Pin to the top of the page", "aria-label": `${on ? "Unpin" : "Pin"} ${g.name}` });
  b.innerHTML = PIN;
  b.addEventListener("click", () => {
    if (on) { setPinned(state.pinned.filter(k => k !== key)); return; }
    const keys = [...state.pinned, key], dropped = keys.length > PIN_MAX ? keys.shift() : null;
    const droppedName = dropped && groupDecks().find(x => deckKey(x) === dropped)?.name;
    setPinned(keys);
    toast(`Pinned ${g.name} to the top of the page.` + (droppedName ? ` ${droppedName} was unpinned: up to ${PIN_MAX} decks can be pinned.` : ""));
    $("pinned").scrollIntoView({ behavior: calmMotion() ? "auto" : "smooth", block: "nearest" });
  });
  return b;
}
// One card per pinned deck: name, cheapest price in stock and sparkline on one line, the shops under it.
// The sparkline opens the price chart, as in the deck list.
function renderPinned() {
  const box = $("pinned");
  const all = groupDecks();
  const decks = state.pinned.map(k => all.find(x => deckKey(x) === k)).filter(Boolean);  // a deck no shop lists any more is skipped
  box.hidden = !decks.length;
  box.replaceChildren();
  for (const g of decks) {
    const best = g.offers.find(o => orderable(o) && typeof o.price === "number") || null;
    const h = deckHistory(g), key = deckKey(g), open = state.pinChart === key;
    const title = el("div", { class: "pin-title" },
      el("h2", {}, g.name, g.kind ? el("span", { class: "kind", text: g.kind }) : null), alertLink(g, "alertbell"), pinButton(g));
    const price = el("div", { class: "pin-price" },
      el("b", { text: best ? money(best.shop, best.price) : "—" }),
      el("span", { class: "avail", text: best ? `cheapest at ${shopName(best.shop)} · ${stockText(g)}` : stockText(g) }));
    let spark = null;
    if (h) {
      spark = el("button", { class: "hbtn", type: "button", "aria-expanded": String(open), title: historySummary(h),
        "aria-label": `Price history for ${g.name}. ${historySummary(h)}` }, sparkline(h));
      spark.addEventListener("click", () => { state.pinChart = open ? null : key; renderPinned(); });
    }
    // Only the shops that have it; the "⋯" chip at the end shows the sold-out ones too.
    const all = state.pinAll.has(key), sold = g.offers.filter(o => !orderable(o)).length;
    const chips = offerChips(all ? g : { offers: g.offers.filter(orderable) }, best, "cheapest in stock");
    if (sold) {
      const more = el("button", { class: "offer more", type: "button", "aria-expanded": String(all),
        text: all ? "Show fewer" : `⋯ ${sold} sold out`, title: all ? "Show only the shops that have it" : "Show all listings" });
      more.addEventListener("click", () => { all ? state.pinAll.delete(key) : state.pinAll.add(key); renderPinned(); $("pinned").querySelector(`[data-key="${key}"] .offer.more`)?.focus(); });
      chips.append(more);
    }
    box.append(el("div", { class: "pincard", "data-key": key },
      el("div", { class: "pin-slim" }, title, price, spark), chips,

  }
}

function renderList() {
  const q = state.q.trim().toLowerCase();
  // A preorder counts as in stock: shops label the same release differently (one "available", another "pre-order").
  const statusMatches = (o) => !state.status || o.status === state.status || (state.status === "in_stock" && o.status === "preorder");
  const matches = (o) => (!state.shop || o.shop === state.shop) && statusMatches(o);
  const all = groupDecks();
  const listed = all.filter(g => g.offers.some(o => !SHOPS[o.shop]?.extra));  // hide CardTrader-only decks
  let rows = listed.filter(g => g.offers.some(matches) &&
    (!q || g.name.toLowerCase().includes(q) || g.offers.some(o => String(o.name).toLowerCase().includes(q))));
  for (const g of rows) g.best = g.offers.find(o => matches(o) && typeof o.price === "number") || null;
  if (state.sort === "price") rows.sort((a, b) => (a.best?.price ?? 1e9) - (b.best?.price ?? 1e9));
  else if (state.sort === "name") rows.sort((a, b) => a.name.localeCompare(b.name));
  // Decks found since tracking began first, then by how recently the shops added them.
  else rows.sort((a, b) => b.newest.localeCompare(a.newest) || b.recency - a.recency || a.name.localeCompare(b.name));
  const list = $("list"); list.replaceChildren();
  list.append(el("div", { class: "item head", role: "row" },
    el("span", { text: "Deck · price per shop" }), el("span", { text: "Availability" }), el("span", { text: "Best price", style: "text-align:right" }), el("span", { text: "First seen" })));
  if (!state.decks.length) {
    list.append(el("div", { class: "item" }, el("span", { class: "deck", text: "Loading tracked decks…" })));
  } else if (!rows.length) {
    list.append(el("div", { class: "item" }, el("span", { class: "deck", text: state.status === "in_stock" ? "No decks in stock match these filters. Set availability to “Any availability” to see all." : "No decks match these filters." })));
  }
  for (const g of rows) {
    const offers = offerChips(g, g.best, "best price for these filters");
    const st = el("span", { class: "st avail", text: stockText(g) });
    if (g.firstSeen) st.append(" ", el("span", { class: "pill new", text: "New" }));
    list.append(el("div", { class: "item", role: "row" },
      el("div", { class: "deck" }, el("span", {}, el("strong", { text: g.name }), g.kind ? el("span", { class: "kind", text: g.kind }) : null,
        alertLink(g, "alertbell"), pinButton(g)), offers),
      st,
      priceCell(g),
      el("span", { class: "seen", text: g.firstSeen ? fmtDate(g.firstSeen) : "Before tracking" })));
    if (state.openHistory === g.name) {
      const h = deckHistory(g);
      if (h) {
        const panel = historyChart(h, g.name);
        // People looking at a deck's prices are the likeliest to want alerts for it.
        const a = alertLink(g, "alertbtn", "Message me on Telegram when it gets cheaper or is back in stock");
        if (a) panel.append(a);
        list.append(el("div", { class: "item hrow" }, panel));
      }
    }
  }
  $("catcount").textContent = `${rows.length} of ${listed.length} decks`;
}

// Price history: data/history.json keeps [day, price or null] points per listing (written by check.py) wherever
// the price or availability changed. A deck's cheapest price on a day is the lowest of its shops' listings.
const HISTORY_DAYS = 90, HISTORY_MIN_DAYS = 14;
const isoDay = (d) => d.toISOString().slice(0, 10);
const shortDay = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short" });
// From the first recorded day (at least 14 days, at most 90), so a short history isn't squeezed against one edge.
function historyDays() {
  const first = Object.values(state.history?.listings || {}).reduce((m, pts) => (pts.length && pts[0][0] < m ? pts[0][0] : m), isoDay(new Date()));
  const since = Math.round((Date.parse(isoDay(new Date())) - Date.parse(first)) / 86400000) + 1;
  const n = Math.min(HISTORY_DAYS, Math.max(HISTORY_MIN_DAYS, since));
  const out = [], d = new Date();
  d.setUTCHours(0, 0, 0, 0); d.setUTCDate(d.getUTCDate() - n + 1);
  for (let i = 0; i < n; i++) { out.push(isoDay(d)); d.setUTCDate(d.getUTCDate() + 1); }
  return out;
}
// Each listing's price on each day (undefined before tracking, null while it can't be ordered).
function listingSeries(points, days) {
  const out = []; let i = 0, v;
  for (const day of days) { while (i < points.length && points[i][0] <= day) v = points[i++][1]; out.push(v); }
  return out;
}
function deckHistory(g) {
  const listings = state.history?.listings;
  if (!listings) return null;
  const days = historyDays();
  const lowest = (offers) => {
    const series = offers.map(o => listingSeries(listings[o.id] || [], days));
    return days.map((_, i) => {
      const prices = series.map(s => s[i]).filter(p => typeof p === "number");
      return prices.length ? Math.min(...prices) : null;
    });
  };
  const shops = lowest(g.offers.filter(o => !SHOPS[o.shop]?.extra));
  const ct = lowest(g.offers.filter(o => SHOPS[o.shop]?.extra));
  const known = shops.map((p, i) => ({ day: days[i], price: p })).filter(x => x.price !== null);
  if (!known.length) return null;
  const low = known.reduce((a, b) => (b.price < a.price ? b : a));
  const high = known.reduce((a, b) => (b.price > a.price ? b : a));
  return { days, shops, ct, low, high, from: known[0].day };
}

// A path through the prices as steps (a price holds until it changes), broken where nothing could be ordered.
function stepPath(prices, x, y) {
  let d = "", prev = null;
  prices.forEach((p, i) => {
    if (p === null) { prev = null; return; }
    if (prev === null) d += `M${x(i)},${y(p)}`;
    else if (p !== prev) d += `H${x(i)}V${y(p)}`;
    prev = p;
    if (i === prices.length - 1 || prices[i + 1] === null) d += `H${x(i + 1)}`;
  });
  return d;
}
const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};

function sparkline(h) {
  const w = 96, ht = 24, n = h.days.length;
  const prices = h.shops.filter(p => p !== null);
  const lo = Math.min(...prices), hi = Math.max(...prices), pad = (hi - lo) * 0.1 || 1;
  const x = (i) => (i / n) * w, y = (p) => ht - 2 - ((p - lo + pad) / (hi - lo + 2 * pad)) * (ht - 4);
  const svg = svgEl("svg", { class: "spark", viewBox: `0 0 ${w} ${ht}`, width: w, height: ht, "aria-hidden": "true" });
  svg.append(svgEl("path", { d: stepPath(h.shops, x, y), fill: "none", stroke: "currentColor", "stroke-width": 1.5 }));
  const li = h.days.indexOf(h.low.day);
  svg.append(svgEl("circle", { cx: x(li) + 1, cy: y(h.low.price), r: 2.5, class: "spark-low" }));
  return svg;
}
function historySummary(h) {
  const span = h.from > h.days[0] ? `since ${shortDay.format(new Date(h.from))}` : `over ${h.days.length} days`;
  return `Cheapest ${span}: low ${pln.format(h.low.price)} (${shortDay.format(new Date(h.low.day))}), high ${pln.format(h.high.price)}`;
}
function historyChart(h, name) {
  const w = 640, ht = 170, m = { l: 56, r: 12, t: 12, b: 26 }, n = h.days.length;
  const all = [...h.shops, ...h.ct].filter(p => p !== null);
  const lo = Math.min(...all), hi = Math.max(...all), pad = (hi - lo) * 0.12 || 5;
  const x = (i) => m.l + (i / n) * (w - m.l - m.r);
  const y = (p) => m.t + (1 - (p - lo + pad) / (hi - lo + 2 * pad)) * (ht - m.t - m.b);
  const svg = svgEl("svg", { class: "hchart", viewBox: `0 0 ${w} ${ht}`, role: "img", "aria-label": `${name}: ${historySummary(h)}` });
  for (const p of [lo, (lo + hi) / 2, hi]) {

    const t = svgEl("text", { x: m.l - 6, y: y(p) + 4, "text-anchor": "end", class: "axis" });
    t.textContent = Math.round(p) + " zł";
    svg.append(t);
  }
  for (const i of [0, Math.floor(n / 2), n - 1]) {
    const t = svgEl("text", { x: x(i), y: ht - 8, "text-anchor": i === 0 ? "start" : i === n - 1 ? "end" : "middle", class: "axis" });
    t.textContent = i === n - 1 ? "Today" : shortDay.format(new Date(h.days[i]));
    svg.append(t);
  }
  if (h.ct.some(p => p !== null)) svg.append(svgEl("path", { d: stepPath(h.ct, x, y), class: "line-ct" }));
  svg.append(svgEl("path", { d: stepPath(h.shops, x, y), class: "line-shops" }));
  const li = h.days.indexOf(h.low.day);
  svg.append(svgEl("circle", { cx: x(li), cy: y(h.low.price), r: 3.5, class: "dot-low" }));
  // Hover: a guide line and the day's prices.
  const guide = svgEl("line", { y1: m.t, y2: ht - m.b, class: "guide", visibility: "hidden" });
  svg.append(guide);
  const tip = el("div", { class: "htip", hidden: "" });
  const wrap = el("div", { class: "hwrap" }, svg, tip);
  svg.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * w;
    const i = Math.max(0, Math.min(n - 1, Math.floor((px - m.l) / (w - m.l - m.r) * n)));
    guide.setAttribute("x1", x(i) + 2); guide.setAttribute("x2", x(i) + 2); guide.setAttribute("visibility", "visible");
    const s = h.shops[i], c = h.ct[i];
    tip.textContent = `${shortDay.format(new Date(h.days[i]))}: ${typeof s === "number" ? pln.format(s) : "not in stock"}`
      + (typeof c === "number" ? ` · CardTrader ≈ ${pln.format(c)}` : "");
    tip.hidden = false;
    tip.style.left = `${Math.min(r.width - 230, Math.max(0, (x(i) / w) * r.width - 60))}px`;
  });
  svg.addEventListener("pointerleave", () => { guide.setAttribute("visibility", "hidden"); tip.hidden = true; });
  const legend = el("div", { class: "hlegend" },
    el("span", { class: "k shops", text: "Cheapest shop" }),
    h.ct.some(p => p !== null) ? el("span", { class: "k ct", text: "CardTrader" }) : null,
    el("span", { class: "k low", text: `Lowest: ${pln.format(h.low.price)}, ${shortDay.format(new Date(h.low.day))}` }));
  return el("div", { class: "hpanel" }, legend, wrap);
}

// Best price, with the deck's sparkline under it; the sparkline opens the full chart below the row.
function priceCell(g) {

// "Changes" panel: events from data/changes.json (written by check.py), last 7 days, newest first.
const CHANGE_DAYS = 7;
const CHANGE_KIND = {
  restock: { label: "Back in stock", cls: "ok", filter: "restock" },
  preorder: { label: "Back in stock", cls: "ok", filter: "restock" },  // shown as in stock, like everywhere else
  new: { label: "New listing", cls: "new", filter: "new" },
  soldout: { label: "Sold out", cls: "off", filter: "soldout" },
  price: { label: "Price", cls: "", filter: "price" },
  cheapest: { label: "Cheapest online", cls: "accent", filter: "price" },
  notcheapest: { label: "No longer cheapest", cls: "off", filter: "price" }
};
const CHANGE_FILTERS = [["", "All"], ["restock", "Back in stock"], ["new", "New listings"], ["price", "Price changes"], ["soldout", "Sold out"]];
const dayfmt = new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "numeric", month: "short" });
const hm = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit" });
// Checks run at :17, and a change happened sometime in the hour before, so show the nearest full hour.
const roughly = (iso) => { const d = new Date(iso); d.setMinutes(d.getMinutes() + 30, 0, 0); d.setMinutes(0); return d; };
const roughTime = (iso) => "~" + hm.format(roughly(iso));
const shopName = (k) => SHOPS[k]?.name || k;
const money = (shop, p) => typeof p === "number" ? (SHOPS[shop]?.approx ? "≈ " : "") + pln.format(p) : "—";

function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const that = new Date(d); that.setHours(0, 0, 0, 0);
  const diff = Math.round((today - that) / 86400000);
  return diff === 0 ? "Today" : diff === 1 ? "Yesterday · " + dayfmt.format(d) : dayfmt.format(d);
}

function changeContext(e) {
  const best = e.best ? `${shopName(e.best.shop)} ${money(e.best.shop, e.best.price)}` : null;
  switch (e.kind) {
    case "soldout":
      return best ? `Still in stock at ${e.inStock} ${e.inStock === 1 ? "shop" : "shops"} · from ${best}` : "Not in stock at any shop now";
    case "cheapest":
      return best ? `Below every shop · next ${best}` : "No shop has it in stock";
    case "notcheapest":
      return best ? `Now cheaper at ${best}` : "";
    default:
      if (e.cheapest && best) return { good: true, text: `Now the cheapest · next ${best}` };
      if (e.cheapest) return { good: true, text: "The only shop with it in stock" };
      return best ? `In stock at ${e.inStock} shops · cheapest ${best}` : "";
  }
}

function changeRows(events) {
  // One row per event, except several new listings from one shop in one check, which share a row.
  // "No longer cheapest" is dropped when a shop event for that deck in the same check explains it.
  const shopEvent = new Set(events.filter(e => e.shop !== "cardtrader").map(e => e.at + "|" + e.group));
  const rows = [];
  for (const e of events) {
    if (e.kind === "notcheapest" && shopEvent.has(e.at + "|" + e.group)) continue;
    const prev = rows[rows.length - 1];
    if (e.kind === "new" && prev && prev.kind === "new" && prev.at === e.at && prev.shop === e.shop) prev.items.push(e);
    else rows.push({ kind: e.kind, at: e.at, shop: e.shop, items: [e] });
  }
  return rows;
}

function renderChangeRow(r) {
  const e = r.items[0], k = CHANGE_KIND[e.kind] || { label: e.kind, cls: "off" };
  let label = k.label, cls = k.cls, main, sub = "";
  const deck = (x) => el("a", { href: safeUrl(x.url), target: "_blank", rel: "noopener", text: x.deck });
  if (r.items.length > 1) {
    // "Foundations Starter – Keen Engineering" ×5 → "5 Foundations Starter decks: Keen Engineering 130,00 zł · …"
    const sets = new Set(r.items.map(x => x.deck.split(" – ")[0]));
    const set = sets.size === 1 && r.items.every(x => x.deck.includes(" – ")) ? [...sets][0] : "";
    label = `${r.items.length} new listings`;
    main = el("span", {}, `${shopName(e.shop)} listed ${r.items.length} ${set ? set + " " : ""}decks`);
    sub = r.items.map(x => `${set ? x.deck.slice(set.length + 3) : x.deck} ${money(x.shop, x.price)}`).join(" · ");
  } else if (e.kind === "price") {
    const down = e.price < e.old, pct = Math.round((e.price - e.old) / e.old * 100);
    label = down ? "Price down" : "Price up"; cls = down ? "ok" : "up";
    main = el("span", {}, deck(e), ` ${e.shop === "cardtrader" ? "on" : "at"} ${shopName(e.shop)} `,
      el("span", { class: "num", text: `${money(e.shop, e.old)} → ${money(e.shop, e.price)}` }), " ",
      el("span", { class: "num " + (down ? "down" : "upc"), text: `${pct > 0 ? "+" : ""}${pct}%` }));
    sub = changeContext(e);
  } else {
    const gone = e.kind === "soldout";
    main = el("span", {}, deck(e), ` ${e.shop === "cardtrader" ? "on" : "at"} ${shopName(e.shop)} `,
      el("span", { class: "num" + (gone ? " gone" : ""), text: money(e.shop, e.price) }));
    sub = changeContext(e);
  }
  const good = typeof sub === "object" && sub?.good;
  const subText = typeof sub === "object" ? sub?.text : sub;
  return el("div", { class: "change" + (state.markFrom && r.at > state.markFrom ? " unseen" : ""), "data-filter": k.filter },
    el("span", { class: "when", text: roughTime(e.at), title: hm.format(new Date(e.at)) }),
    el("span", {}, el("span", { class: "tag " + cls, text: label })),
    el("div", { class: "what" }, el("div", {}, main), subText ? el("div", { class: "ctx" + (good ? " good" : ""), text: subText }) : null));
}

function recentRows() {
  const since = Date.now() - CHANGE_DAYS * 86400000;
  return changeRows((state.changes || []).filter(e => Date.parse(e.at) >= since).sort((a, b) => b.at.localeCompare(a.at)));
}

// One list, newest first. Folded, it shows the last 2 changes, or every change since your last visit if there are
// more, with the next one fading out under them. The button on its faded edge extends it downwards with the rest
// of the last 7 days, and brings up the filters.
const FOLDED_ROWS = 2;
const foldedCount = (list) => Math.min(list.length,
  Math.max(FOLDED_ROWS, state.markFrom ? list.filter(r => r.at > state.markFrom).length : 0));

function renderChanges() {
  const rows = recentRows();
  const fresh = state.markFrom ? rows.filter(r => r.at > state.markFrom).length : 0;
  $("changes-sum").replaceChildren(fresh ? el("b", { text: `${fresh} new since your last visit` })
    : state.changes && !rows.length ? `No changes in the last ${CHANGE_DAYS} days` : "");
  const chips = $("changes-filters"); chips.replaceChildren();
  if (rows.length && state.changesAll) for (const [f, label] of CHANGE_FILTERS) {
    const n = f ? rows.filter(r => (CHANGE_KIND[r.kind] || {}).filter === f).length : rows.length;
    const b = el("button", { class: "chip", type: "button", "aria-pressed": String(state.changeFilter === f), text: `${label} ${n}` });
    b.addEventListener("click", () => { state.changeFilter = f; renderChanges(); });
    chips.append(b);
  }
  const shown = rows.filter(r => !state.changeFilter || (CHANGE_KIND[r.kind] || {}).filter === state.changeFilter);
  const top = shown.slice(0, foldedCount(shown));
  const box = $("changes-list"); box.replaceChildren();
  if (rows.length && !shown.length) box.append(el("div", { class: "empty", text: "Nothing like that in the last 7 days." }));
  const peek = state.changesAll ? [] : shown.slice(top.length, top.length + 1);
  // Folded, the next earlier changes go in a short box that fades out; clicking it expands.
  const peekBox = el("div", { class: "peek", "aria-hidden": "true" });
  peekBox.addEventListener("click", () => toggleChanges());
  let day = "";
  (state.changesAll ? shown : top.concat(peek)).forEach((r, i) => {
    const into = state.changesAll || i < top.length ? box : peekBox;
    // "extra" marks what only the expanded list has, so the fold animation can fade it in and out.
    const extra = i >= top.length ? " extra" : "";
    const label = dayLabel(roughly(r.at));
    if (label !== day) { day = label; into.append(el("div", { class: "day" + extra, text: label })); }
    const row = renderChangeRow(r);
    if (extra) row.classList.add("extra");
    if (into === peekBox) row.querySelectorAll("a").forEach(a => a.tabIndex = -1);
    into.append(row);
  });
  if (peek.length) box.append(peekBox);
  // Folded is never filtered (folding clears the filter), so count the unfiltered rows.
  const rest = rows.length - foldedCount(rows);
  $("changes-edge").hidden = state.changesAll || !rest;
  $("changes-less").hidden = !state.changesAll || !rest;
  $("changes-more").textContent = `${rest} earlier ${rest === 1 ? "change" : "changes"} ▾`;
}

function renderAll() { renderShops(); renderPinned(); renderChanges(); renderNew(); renderList(); }

$("q").addEventListener("input", (e) => { state.q = e.target.value; renderList(); });
$("status").addEventListener("change", (e) => { state.status = e.target.value; renderList(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; renderList(); });
state.status = $("status").value; // the browser may restore an earlier choice on reload
// Remember whether the Changes list was expanded (per browser; storage may be unavailable).
try { state.changesAll = localStorage.getItem("changesOpen") === "1"; } catch {}
// Expanding grows the panel and fades the earlier changes in; folding fades them out first, then closes the gap.
let folding = false;
async function toggleChanges() {
  if (folding) return;
  folding = true;
  const fold = $("changes-fold"), list = $("changes-list");
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ease = "cubic-bezier(.2, .7, .3, 1)";
  const extras = () => [...fold.querySelectorAll(".extra"), $("changes-filters"), $("changes-less")]
    .filter(x => x.classList.contains("extra") || (x.id === "changes-filters" ? x.childElementCount : !x.hidden));
  if (state.changesAll && !calm) {
    await Promise.all(extras().map(x => x.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, easing: "ease-in", fill: "forwards" }).finished));
  }
  // Folding from far down the list: bring the panel's top back into view, or it would end up above the screen.
  const top = fold.closest("section").getBoundingClientRect().top;
  if (state.changesAll && top < 0) window.scrollTo({ top: scrollY + top - 16, behavior: calm ? "auto" : "smooth" });
  const h0 = fold.offsetHeight, y0 = list.getBoundingClientRect().top;
  state.changesAll = !state.changesAll;
  if (!state.changesAll) state.changeFilter = "";
  try { localStorage.setItem("changesOpen", state.changesAll ? "1" : "0"); } catch {}
  renderChanges();
  [$("changes-filters"), $("changes-less")].forEach(x => x.getAnimations().forEach(a => a.cancel())); // drop the fade-outs they kept
  if (!calm) {
    const h1 = fold.offsetHeight, dy = y0 - list.getBoundingClientRect().top;
    fold.style.overflow = "hidden";
    const grow = fold.animate([{ height: h0 + "px" }, { height: h1 + "px" }], { duration: 280, easing: ease });
    // The filters appear (or go) above the rows, so slide the rows from where they were instead of jumping.
    if (dy) list.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 280, easing: ease });
    if (state.changesAll) extras().forEach((x, i) => x.animate(
      [{ opacity: 0, transform: "translateY(-6px)" }, { opacity: 1, transform: "none" }],
      { duration: 240, delay: 60 + Math.min(i, 12) * 18, easing: ease, fill: "backwards" }));
    await grow.finished.catch(() => {});
    fold.style.overflow = "";
  }
  folding = false;
}
$("changes-more").addEventListener("click", toggleChanges);
$("changes-fewer").addEventListener("click", toggleChanges);

// Panels: each visitor can fold a panel down to its title line and change their order (remembered per browser).
const PANELS = ["changes", "new", "decks"];
const PANEL_NAME = { changes: "Changes", new: "New listings", decks: "All tracked decks" };
const ICON = {
  chev: '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>',
  more: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/></svg>'
};
let layout = { order: PANELS.slice(), closed: [] };
try {
  const saved = JSON.parse(localStorage.getItem("panels") || "null");
  if (saved) {
    const order = (saved.order || []).filter(p => PANELS.includes(p));
    layout = { order: [...new Set([...order, ...PANELS])], closed: (saved.closed || []).filter(p => PANELS.includes(p)) };
  }
} catch {}
const saveLayout = () => { try { localStorage.setItem("panels", JSON.stringify(layout)); } catch {} };
const panelEl = (p) => document.querySelector(`.panel[data-panel="${p}"]`);
const calmMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function applyLayout() {
  $("panels").append(...layout.order.map(panelEl));
  layout.order.forEach((p, i) => {
    const sec = panelEl(p), closed = layout.closed.includes(p);
    sec.classList.toggle("closed", closed);
    sec.querySelector(".ptoggle").setAttribute("aria-expanded", String(!closed));
    sec.querySelectorAll("[data-move='-1']").forEach(b => b.disabled = i === 0);
    sec.querySelectorAll("[data-move='1']").forEach(b => b.disabled = i === layout.order.length - 1);
    const t = sec.querySelector("[data-act='fold']");
    if (t) t.textContent = closed ? "Expand" : "Collapse to one line";
  });
}

// Moving a panel keeps it where it is on screen and slides the others around it.
function movePanel(p, by, focus) {
  const from = layout.order.indexOf(p), to = from + by;
  if (to < 0 || to >= layout.order.length) return;
  const els = layout.order.map(panelEl), top0 = new Map(els.map(x => [x, x.getBoundingClientRect().top]));
  layout.order.splice(from, 1); layout.order.splice(to, 0, p);
  saveLayout(); applyLayout();
  const me = panelEl(p);
  window.scrollBy(0, me.getBoundingClientRect().top - top0.get(me));
  if (focus) focus.focus({ preventScroll: true });
  if (calmMotion()) return;
  for (const x of els) {
    const dy = top0.get(x) - x.getBoundingClientRect().top;
    if (dy) x.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 260, easing: "cubic-bezier(.2, .7, .3, 1)" });
  }
}

async function togglePanel(p) {
  const sec = panelEl(p), head = sec.querySelector(".phead");
  const closing = !layout.closed.includes(p);
  layout.closed = closing ? [...layout.closed, p] : layout.closed.filter(x => x !== p);
  saveLayout();
  const h0 = sec.offsetHeight;
  // Very tall panels (the deck list) just snap; a long slide reads as the page jumping.
  const animate = !calmMotion();
  if (closing && animate && h0 < innerHeight * 1.5) {
    sec.style.overflow = "hidden";
    await sec.animate([{ height: h0 + "px" }, { height: head.offsetHeight + "px" }], { duration: 220, easing: "ease-in-out" }).finished.catch(() => {});
    sec.style.overflow = "";
  }
  applyLayout();
  if (!closing && animate && sec.offsetHeight < innerHeight * 1.5) {
    sec.style.overflow = "hidden";
    await sec.animate([{ height: head.offsetHeight + "px" }, { height: sec.offsetHeight + "px" }], { duration: 260, easing: "cubic-bezier(.2, .7, .3, 1)" }).finished.catch(() => {});
    sec.style.overflow = "";
  }
}

function closeMenus(except) {
  document.querySelectorAll(".pmenu").forEach(m => { if (m !== except) { m.hidden = true; m.previousElementSibling.setAttribute("aria-expanded", "false"); } });
}

for (const p of PANELS) {
  const sec = panelEl(p), head = sec.querySelector(".phead"), h2 = head.querySelector("h2");
  const name = PANEL_NAME[p];
  const toggle = el("button", { class: "ptoggle", type: "button", "aria-expanded": "true", title: "Collapse or expand" });
  toggle.innerHTML = ICON.chev;
  toggle.append(h2.textContent);
  h2.replaceChildren(toggle);
  toggle.addEventListener("click", () => togglePanel(p));

  // A menu to move the panel up or down, or fold it.
  const mb = el("button", { class: "iconbtn", type: "button", "aria-haspopup": "true", "aria-expanded": "false", title: "Panel options", "aria-label": `${name} panel options` });
  mb.innerHTML = ICON.more;
  const menu = el("div", { class: "pmenu", role: "menu", hidden: "" });
  for (const [act, label, by] of [["up", "Move up", -1], ["down", "Move down", 1], ["fold", "Collapse to one line"]]) {
    const b = el("button", { type: "button", role: "menuitem", text: label, "data-act": act });
    if (by) b.dataset.move = String(by);
    b.addEventListener("click", () => { closeMenus(); if (by) movePanel(p, by, mb); else togglePanel(p); });
    menu.append(b);
  }
  mb.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = menu.hidden;
    closeMenus(menu); menu.hidden = !open; mb.setAttribute("aria-expanded", String(open));
    if (open) menu.querySelector("button:not(:disabled)")?.focus();
  });
  // Up and down arrows step through the menu.
  menu.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const items = [...menu.querySelectorAll("button:not(:disabled)")];
    const i = items.indexOf(document.activeElement) + (e.key === "ArrowDown" ? 1 : -1);
    items[(i + items.length) % items.length]?.focus();
  });
  head.append(el("div", { class: "pctl" }, mb, menu));
}
document.addEventListener("click", (e) => { if (!e.target.closest(".pctl")) closeMenus(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const open = document.querySelector(".pmenu:not([hidden])");
  if (open) { closeMenus(); open.previousElementSibling.focus(); }
});
applyLayout();
renderChips(); renderAll();

// Unseen changes: the tab icon's eye is open and the title says "(N)" while there's something you haven't seen;
// once you've looked, the eye closes. seenAt is the newest change this browser has had in front of it;
// rows after markFrom get a dot in the list.
let seenAt = null;
try { seenAt = localStorage.getItem("seenChanges"); } catch {}
state.markFrom = seenAt;
const TITLE = document.title;
const ICONS = [...document.querySelectorAll('link[rel="icon"]')].map(l => l.cloneNode());
let closedIcon = null, eyeClosed = false;

function setIcons(links) {
  document.querySelectorAll('link[rel="icon"]').forEach(l => l.remove());
  document.head.append(...links);
}
function closeEye(on) {
  if (on === eyeClosed) return;
  eyeClosed = on;
  if (!on) { setIcons(ICONS.map(l => l.cloneNode())); return; }
  const apply = () => eyeClosed && setIcons([el("link", { rel: "icon", type: "image/png", href: closedIcon })]);
  if (closedIcon) { apply(); return; }
  // Drawn to a PNG so browsers without SVG favicons get it too.
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    c.getContext("2d").drawImage(img, 0, 0, 64, 64);
    closedIcon = c.toDataURL("image/png");
    apply();
  };
  img.src = "favicon-seen.svg";
}
function updateBadge() {
  if (!state.changes) return;
  const n = seenAt ? recentRows().filter(r => r.at > seenAt).length : 0;
  document.title = n ? `(${n}) ${TITLE}` : TITLE;
  closeEye(n === 0);
}
// Counts as seen once the tab is in front and focused; what arrived since the last look stays marked in the list.
function lookedAt() {
  if (!state.changes || document.visibilityState !== "visible" || !document.hasFocus()) return;
  const latest = state.changes.reduce((m, e) => e.at > m ? e.at : m, "");
  if (latest && latest !== seenAt) {
    state.markFrom = seenAt || latest;
    seenAt = latest;
    try { localStorage.setItem("seenChanges", seenAt); } catch {}
    renderChanges();
  }
  updateBadge();
}

// A sound when a background refresh brings new changes (off by default, remembered per browser).
// It's generated, so there's no audio file. Browsers allow sound only after a click or key press on the page,
// so the first one (switching it on, or any click after a reload) unlocks it.
let soundOn = false, audio = null;
try { soundOn = localStorage.getItem("sound") === "1"; } catch {}
// Two quick bright notes, like picking up a coin: [frequency Hz, start s, length s, waveform].
const SOUND = [[987.77, 0, 0.12, "triangle"], [1318.5, 0.09, 0.45, "triangle"]];
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (audio.state === "suspended") audio.resume().catch(() => {});
  return audio;
}
function playSound() {
  const ctx = unlockAudio();
  if (!ctx) return;
  const t = ctx.currentTime + 0.02;
  for (const [freq, at, length, type] of SOUND) {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t + at);
    gain.gain.exponentialRampToValueAtTime(0.18, t + at + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + at + length);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t + at); osc.stop(t + at + length + 0.05);
  }
}
function renderSound() {
  $("sound").setAttribute("aria-pressed", String(soundOn));
  $("sound").querySelector("span").textContent = soundOn ? "Sound on" : "Sound off";
}
$("sound").addEventListener("click", () => {
  soundOn = !soundOn;
  try { localStorage.setItem("sound", soundOn ? "1" : "0"); } catch {}
  renderSound();
  if (soundOn) playSound();
});
// After a reload the browser has muted the page again; the first click or key press anywhere lifts that.
for (const ev of ["pointerdown", "keydown"]) document.addEventListener(ev, () => { if (soundOn) unlockAudio(); }, { once: true, capture: true });
renderSound();
const newestChange = () => (state.changes || []).reduce((m, e) => (e.at > m ? e.at : m), "");
// The sound is for good news only: a deck back in stock, a new deck, or a new cheapest option
// (CardTrader becoming the cheapest, or a shop's price drop that makes it the cheapest).
// "No longer cheapest", sold out and other price moves stay quiet.
const chimes = (e) => e.kind === "restock" || e.kind === "preorder" || e.kind === "new" || e.kind === "cheapest"
  || (e.kind === "price" && e.price < e.old && e.cheapest === true);

let loadedAt = 0, dataKey = "";
async function load() {
  loadedAt = Date.now();
  const bust = "?t=" + Math.floor(Date.now() / 60000);
  const get = (f) => fetch("data/" + f + bust).then(r => r.ok ? r.text() : Promise.reject(new Error(f + " " + r.status)));
  try {
    const [decks, meta, changes, history] = await Promise.all([
      get("decks.json"), get("state.json").catch(() => "null"), get("changes.json").catch(() => "[]"),
      get("history.json").catch(() => "null")
    ]);
    // Re-render only when the data changed, so a background refresh doesn't disturb the page.
    const key = decks + "\n" + meta + "\n" + changes + "\n" + history;
    if (key !== dataKey) {
      const before = dataKey ? newestChange() : null;  // null on the first load: no sound for what's already there
      state.decks = JSON.parse(decks);
      state.meta = JSON.parse(meta);
      state.changes = JSON.parse(changes);
      state.history = JSON.parse(history);
      dataKey = key;
      renderAll();
      if (soundOn && before !== null && state.changes.some(e => e.at > before && chimes(e))) playSound();
    }
    updateBadge();
    lookedAt();
  } catch (e) {
    if (!dataKey) $("list").replaceChildren(el("div", { class: "item" }, el("span", { class: "deck", text: "Couldn't load data/decks.json. Check that the repository has the data folder." })));
  }
  // Last run time comes from the GitHub API (works for public repos).
  const owner = location.hostname.split(".")[0];
  const repo = location.pathname.split("/").filter(Boolean)[0];
  if (location.hostname.endsWith("github.io") && repo) {
    try {
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/check.yml/runs?per_page=1`);
      const run = (await r.json()).workflow_runs?.[0];
      if (run) {
        const when = tfmt.format(new Date(run.updated_at || run.created_at));
        const how = run.status !== "completed" ? "running now" : run.conclusion === "success" ? "OK" : run.conclusion;
        $("lastcheck").textContent = `Last check ${when} · ${how}`;
      }
    } catch {}
  }
}

// An open tab checks for new data every 10 minutes, and right away when it comes back after longer.
const REFRESH_MS = 10 * 60000;
load();
setInterval(load, REFRESH_MS);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - loadedAt > REFRESH_MS) load();
  else lookedAt();
});
window.addEventListener("focus", lookedAt);
// Another tab marked the changes seen.
window.addEventListener("storage", (e) => { if (e.key === "seenChanges" && e.newValue) { seenAt = e.newValue; updateBadge(); } });
</script>
</body>
</html>
