name: Check for new Commander decks

on:
  schedule:
    - cron: "41 * * * *"   # hourly backup; the main hourly check is started externally via workflow_dispatch
  workflow_dispatch:        # "Run workflow" button for a manual check
    inputs:
      test_push:
        description: "Only send a test push notification (no scan)"
        type: boolean
        default: false
      cardtrader_discover:
        description: "Only print CardTrader's catalogue structure (no scan)"
        type: boolean
        default: false

permissions:
  contents: write           # lets the job commit data/decks.json

concurrency:
  group: commander-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main           # latest main, not the commit the run was queued on, so "Save changes" can push

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check shops
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python check.py ${{ inputs.test_push && '--test-push' || '' }} ${{ inputs.cardtrader_discover && '--cardtrader-discover' || '' }}

      - name: Save changes
        run: |
          git config user.name "commander-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update decks $(date -u +'%Y-%m-%d %H:%M UTC')"
            # GitHub occasionally answers a push with a 500. Retry a few times, rebasing in case
            # main moved, so one hiccup doesn't lose the run (and repeat its pushes next time).
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push failed (attempt $attempt); retrying."
              sleep $((attempt * 10))
              git pull --rebase --quiet origin main
            done
            exit 1
          fi
