name: Check for new Commander decks

on:
  schedule:
    - cron: "41 * * * *"   # backup: skipped when a check ran in the last 40 min (the Worker in worker/ starts it at :17)
  workflow_dispatch:        # "Run workflow" button for a manual check
    inputs:
      test_push:
        description: "Only send a test push notification (no scan)"
        type: boolean
        default: false
      cardtrader_discover:
        description: "Only print CardTrader's catalogue structure (no scan)"
        type: boolean
        default: false

permissions:
  contents: write           # lets the job commit data/decks.json
  actions: read             # lets the backup run see whether a check ran recently

concurrency:
  group: commander-watch
  cancel-in-progress: false

jobs:
  # GitHub's schedule is only a backup for the Worker's :17 start, and often runs late. It goes ahead only
  # if no check succeeded (or is running) in the last 40 minutes, i.e. when the :17 start didn't happen.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - id: recent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          filter="[.[] | select(.databaseId != $GITHUB_RUN_ID and .createdAt >= \"$since\" and (.conclusion == \"success\" or .status != \"completed\"))] | length"
          recent=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml --limit 10 \
            --json databaseId,createdAt,status,conclusion --jq "$filter")
          if [ "$recent" -gt 0 ]; then
            echo "A check ran in the last 40 minutes; skipping this backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main           # latest main, not the commit the run was queued on, so "Save changes" can push

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check shops
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BOT_ALERTS_KEY: ${{ secrets.BOT_ALERTS_KEY }}
          BOT_API_URL: https://commander-watch-bot.maciej-janowski.workers.dev
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python check.py ${{ inputs.test_push && '--test-push' || '' }} ${{ inputs.cardtrader_discover && '--cardtrader-discover' || '' }}

      - name: Save changes
        run: |
          git config user.name "commander-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update decks $(date -u +'%Y-%m-%d %H:%M UTC')"
            # GitHub occasionally answers a push with a 500. Retry a few times, rebasing in case
            # main moved, so one hiccup doesn't lose the run (and repeat its pushes next time).
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push failed (attempt $attempt); retrying."
              sleep $((attempt * 10))
              git pull --rebase --quiet origin main
            done
            exit 1
          fi
