name: Check for new Commander decks

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC); GitHub may start it a few minutes late
  workflow_dispatch:        # "Run workflow" button for a manual check

permissions:
  contents: write           # lets the job commit data/decks.json

concurrency:
  group: commander-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check shops
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python check.py

      - name: Save changes
        run: |
          git config user.name "commander-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update decks $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
