name: Bot replies

# Answers the Telegram bot's messages (subscribe, /list, /stop) without scanning the shops, so replies
# take a minute or two instead of waiting for the hourly check. Started every 2 minutes by cron-job.org
# (workflow_dispatch); the schedule below is only a slow backup.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write           # commits data/subscribers.enc when someone subscribes or stops

concurrency:
  group: commander-watch    # shared with the hourly check: never both reading the bot's messages at once
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Answer messages
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python check.py --bot

      - name: Save subscribers
        run: |
          git config user.name "commander-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.enc
          if git diff --cached --quiet; then
            echo "No subscriber changes."
          else
            git commit -m "Update bot subscribers"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push failed (attempt $attempt); retrying."
              sleep $((attempt * 5))
              git pull --rebase --quiet origin main
            done
            exit 1
          fi
