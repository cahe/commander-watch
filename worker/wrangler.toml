# Cloudflare Worker for the Telegram bot; see src/index.js. Deployed by .github/workflows/deploy-worker.yml
# when worker/ changes on main (or by hand from this folder: npx wrangler deploy).
name = "commander-watch-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "dc06a3ed90727cc1e35f49615a9bf6f4"  # not a secret; lets the deploy workflow find the account

[vars]
PAGE_URL = "https://cahe.github.io/commander-watch/"
DATA_URL = "https://cahe.github.io/commander-watch/data/bot.json"
GITHUB_REPO = "cahe/commander-watch"
# Public half of the key device notifications are signed with (the page subscribes with it too).
VAPID_PUBLIC_KEY = "BOBRIqXSvDG1igB54C39MXlWbzP6cWSaIF1szOZDL5JuQOeYe91uOgLREou4qhk659o4HH4IauRjF3IxT81t0sE"

# Starts the hourly check (check.yml) at :17, as cron-job.org did. Times are UTC; :17 is the same in Poland.
[triggers]
crons = ["17 * * * *"]

# Who watches which deck. Created with: npx wrangler kv namespace create SUBS
[[kv_namespaces]]
binding = "SUBS"
id = "0609d03db49b44619a236f814bd9d87a"
